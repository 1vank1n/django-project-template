version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      javascript-dependencies:
        patterns: ["*"]
    # pnpm отклоняет пакеты моложе minimumReleaseAge (24 ч), поэтому PR должен отлежаться
    cooldown:
      default-days: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
