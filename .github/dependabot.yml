version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # pnpm отклоняет пакеты моложе minimumReleaseAge (24 ч), поэтому PR должен отлежаться
    cooldown:
      default-days: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
